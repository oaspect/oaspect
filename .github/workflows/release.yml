name: Release

on:
  push:
    branches:
      - main

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    if: github.repository == 'oaspect/oaspect'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing (OIDC) needs npm 11.5.1+; pnpm publishes through npm.
      # Not 12: it rejects the flags pnpm passes on (--git-checks).
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Opens a "Version packages" PR from pending changesets; once that PR is
      # merged, publishes the new versions to npm. No NPM_TOKEN: npm trusts
      # this workflow (trusted publishing) and adds provenance itself.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          title: "(chore) release: version packages"
          commit: "(chore) release: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
